<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyCash — кошелёк (финал) в 8 цветах</title>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; padding:48px 24px 80px; background:#F5F5F7; color:#1d1d1f; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-0.02em; margin:0 0 6px; }
  .sub { color:#6e6e73; font-size:15px; margin:0 0 36px; line-height:1.5; }
  .card { background:#fff; border-radius:22px; padding:26px 28px 30px; margin-bottom:24px;
          box-shadow:0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.04); }
  .card h2 { font-size:18px; font-weight:600; margin:0 0 20px; letter-spacing:-0.01em; }
  .grid { display:flex; flex-wrap:wrap; gap:20px 22px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; width:78px; }
  .item svg { width:56px; height:56px; display:block; }
  .item .name { font-size:12px; color:#86868b; text-align:center; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid #f0f0f2; }
  .row:last-child { border-bottom:none; }
  .row .ic svg, .row .ic img { width:30px; height:30px; display:block; border-radius:6px; }
  .row .nm { flex:1; font-size:15px; font-weight:500; }
  .row .am { font-size:14px; color:#86868b; }
  .badge { display:inline-block; background:#eef6ff; color:#007AFF; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:middle; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Кошелёк — финальный вид</h1>
  <p class="sub">Выбранный вариант 2 в реальных 8 цветах счетов MyCash. Один значок, отличается только цветом.
  Наличка и Касса остаются со своими значками (бренд распознаётся по названию).</p>

  <div class="card">
    <h2>8 цветов палитры счетов</h2>
    <div class="grid" id="swatches"></div>
  </div>

  <div class="card">
    <h2>Как выглядит в списке счетов</h2>
    <div id="list"></div>
  </div>
</div>

<script>
  // Точная палитра из приложения (WALLET_COLORS)
  const COLORS = [
    ['#007AFF','Синий'], ['#5856D6','Индиго'], ['#34C759','Зелёный'], ['#FF9500','Оранжевый'],
    ['#FF2D55','Розовый'], ['#AF52DE','Фиолетовый'], ['#5AC8FA','Бирюзовый'], ['#FFCC00','Жёлтый']
  ];

  // Та же функция, что встроена в app-core.js (walletSquircle)
  function wallet(c, size){ size = size || 56; return `
    <svg viewBox="0 0 48 48" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="12" fill="${c}"/>
      <rect x="10" y="15" width="28" height="19" rx="4.5" fill="#fff"/>
      <path d="M28 22 h11 v6 h-11 a3 3 0 0 1 0 -6 z" fill="#fff"/>
      <circle cx="30.5" cy="25" r="2.1" fill="${c}"/>
    </svg>`; }

  document.getElementById('swatches').innerHTML = COLORS.map(([c,nm]) =>
    `<div class="item">${wallet(c)}<div class="name">${nm}</div></div>`).join('');

  // Макет списка: брендовые (Наличка/Касса) + обычные счета-кошельки в разных цветах
  const list = [
    {brand:'cash',  nm:'Наличка',          am:'48 200 ₽'},
    {brand:'kassa', nm:'Касса магазина',   am:'12 750 ₽'},
    {c:'#007AFF',   nm:'Резервный счёт',   am:'125 400 ₽'},
    {c:'#AF52DE',   nm:'Накопления',       am:'300 000 ₽'},
    {c:'#FF9500',   nm:'Подотчёт Иванов',  am:'5 000 ₽'},
    {c:'#5AC8FA',   nm:'Сейф офис',        am:'80 000 ₽'},
  ];
  function brandImg(b){
    const src = b==='cash' ? 'docs/cash.svg' : 'docs/kassa.svg';
    return `<img src="${src}" alt="">`;
  }
  document.getElementById('list').innerHTML = list.map(r => `
    <div class="row">
      <div class="ic">${r.brand ? brandImg(r.brand) : wallet(r.c, 30)}</div>
      <div class="nm">${r.nm}</div>
      <div class="am">${r.am}</div>
    </div>`).join('');
</script>
</body>
</html>
